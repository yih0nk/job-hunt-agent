# Copy to config/preferences.yaml (gitignored). Hard filters + targeting. Public template.

sources:
  # GitHub listing repos to poll (owner/repo + branch + the markdown file with the table).
  github_repos:
    - repo: "owner/repo"
      branch: "main"
      file: "README.md"
  # Optional: specific company ATS boards to poll directly (Greenhouse/Lever board URLs).
  company_boards: []
  # Optional: web listing pages parsed from their public HTML (e.g. Early Career Radar).
  # accept_tracks uses the source's own role classification instead of the title regex;
  # accept_hubs limits to named regions. Only the public page is fetched, never an API.
  web_sources:
    - name: "early-career-radar"
      url: "https://www.earlycareerradar.com/jobs"
      accept_tracks: ["SWE", "ML & AI"]
      accept_hubs: []

# Hard filters — applied by the Scout before anything is scored.
role_types: ["swe", "ai", "ml", "backend", "fullstack"]  # keyword-matched against role title
term: "internship"          # internship | newgrad | both
target_term: "Summer 2027"  # human label; used in the eligibility gate
locations:
  accept: ["SF", "San Francisco", "NYC", "New York", "remote"]
  accept_metros: true       # also accept other major metros
  accept_canada: true
drop_if_role_contains: ["🎓", "PhD", "Master", "Grad", "New Grad", "Full-time"]

# Drop any role whose title carries these terms (e.g. a hard no on defense/clearance work).
exclude_role_keywords: ["defense", "itar", "clearance", "classified", "top secret", " ctj"]
# Companies to hard-exclude by category (e.g. defense). Extend as new ones appear.
defense_companies: []

exclude_companies: []       # never surface these
already_applied: []         # companies already applied to — skipped in scans

# Trackers — source of truth for already-applied/drafted positions. Both are read for
# dedup so a position is never surfaced, re-drafted, or re-contacted twice.
tracker_path: "~/path/to/submitted-applications.md"          # authoritative: actually submitted
packages_tracker_path: "~/path/to/tailored-packages.md"      # tailored packages (may be unsubmitted)

scoring_config: "config/scoring.yaml"
report:
  schedule: "daily 08:00"   # aligns with the existing morning inbox sweep
